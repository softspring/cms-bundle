name: Build dist

on:
    workflow_run:
        workflows: [ CI ]
        branches: [ 6.0 ]
        types: [ completed ]
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    build-dist:
        if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v6
                with:
                    fetch-depth: 0
                    ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            -   name: Install Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '18'

            -   name: Cache npm packages
                id: npm-cache
                uses: actions/cache@v5
                with:
                    path: node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
                    restore-keys: |
                        ${{ runner.os }}-node-

            -   name: Check asset source changes
                id: asset-changes
                run: |
                    if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                        echo "changed=true" >> "$GITHUB_OUTPUT"
                        exit 0
                    fi

                    if git diff --name-only HEAD^ HEAD -- assets/build-dist.mjs assets/scripts assets/styles package.json | grep -q .; then
                        echo "changed=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "changed=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Install npm dependencies
                if: steps.asset-changes.outputs.changed == 'true'
                run: npm install --no-package-lock --no-audit --no-fund

            -   name: Build dist
                if: steps.asset-changes.outputs.changed == 'true'
                run: npm run build

            -   name: Create pull request
                if: steps.asset-changes.outputs.changed == 'true'
                id: create-pull-request
                uses: peter-evans/create-pull-request@v7
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    branch: automation/build-dist-${{ github.event.workflow_run.head_branch || github.ref_name }}
                    base: ${{ github.event.workflow_run.head_branch || github.ref_name }}
                    delete-branch: true
                    commit-message: 'chore: build dist'
                    title: 'chore: build dist'
                    body: |
                        This pull request updates the published assets generated from the asset sources.

                        It is created automatically after changes in `assets/` or `package.json`.
                    labels: automated, assets

            -   name: Enable auto-merge
                if: steps.create-pull-request.outputs.pull-request-number != ''
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: gh pr merge ${{ steps.create-pull-request.outputs.pull-request-number }} --squash --delete-branch
