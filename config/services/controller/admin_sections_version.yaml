#                    success_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_EXPORT_SUCCESS
#                    failure_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_EXPORT_FAILURE
#                    exception_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_EXPORT_EXCEPTION
                version_list:
                    is_granted: 'PERMISSION_SFS_CMS_ADMIN_SECTION_VERSIONS'
                    initialize_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_LIST_INITIALIZE
                    filter_form_prepare_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_LIST_FILTER_FORM_PREPARE
                    filter_form_init_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_LIST_FILTER_FORM_INIT
                    filter_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_LIST_FILTER
                    view_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_LIST_VIEW
                    exception_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_LIST_EXCEPTION
                    view: '%sfs_cms.admin.sections_version.list_view%'
#                    view_page: '%sfs_cms.admin.sections_version.list_page_view%'
                    filter_form: '@Softspring\CmsBundle\Form\Admin\SectionVersion\VersionListFilterFormInterface'
                version_clear_compiled:
                    is_granted: 'PERMISSION_SFS_CMS_ADMIN_SECTION_VERSION_CLEAR_COMPILED'
                    param_converter_key: 'id'
                    initialize_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_CLEAR_COMPILED_INITIALIZE
                    load_entity_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_CLEAR_COMPILED_LOAD_ENTITY
                    not_found_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_CLEAR_COMPILED_NOT_FOUND
                    found_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_CLEAR_COMPILED_FOUND
                    apply_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_CLEAR_COMPILED_APPLY
                    success_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_CLEAR_COMPILED_SUCCESS
                    failure_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_CLEAR_COMPILED_FAILURE
                    exception_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_CLEAR_COMPILED_EXCEPTION
