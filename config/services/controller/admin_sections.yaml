                    failure_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_UPDATE_FAILURE
                    form_invalid_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_UPDATE_FORM_INVALID
                    view_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_UPDATE_VIEW
                    exception_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_UPDATE_EXCEPTION
                    success_redirect_to: 'sfs_cms_admin_sections_details'
                    view: '%sfs_cms.admin.sections.update_view%'
                    form: '@Softspring\CmsBundle\Form\Admin\Section\SectionUpdateFormInterface'
