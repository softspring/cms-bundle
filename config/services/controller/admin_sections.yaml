parameters:
    sfs_cms.admin.sections.list_view: '@@SfsCms/admin/section/list.html.twig'
    sfs_cms.admin.sections.list_page_view: '@@SfsCms/admin/section/list-page.html.twig'
    sfs_cms.admin.sections.create_view: '@@SfsCms/admin/section/create.html.twig'
    sfs_cms.admin.sections.update_view: '@@SfsCms/admin/section/update.html.twig'
    sfs_cms.admin.sections.delete_view: '@@SfsCms/admin/section/delete.html.twig'
    sfs_cms.admin.sections.read_view: '@@SfsCms/admin/section/read.html.twig'
    sfs_cms.admin.sections.preview_view: '@@SfsCms/admin/section/preview.html.twig'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $entityDuplicators: !tagged_iterator { tag: sfs_cms.content_entity_duplicator }
#            $em: '@sfs_cms.entity_manager'
#            $sectionCacheType: '%sfs_cms.section.cache.type%'

    Softspring\CmsBundle\Admin\ActionListener\Section\:
        resource: '../../src/Admin/ActionListener/Section/*'

    Softspring\CmsBundle\Form\Admin\Section\:
        resource: '../../../src/Form/Admin/Section/*'

    Softspring\CmsBundle\Manager\SectionManagerInterface:
        class: Softspring\CmsBundle\Manager\SectionManager

    Softspring\CmsBundle\Form\Admin\Section\SectionCreateFormInterface:
        class: Softspring\CmsBundle\Form\Admin\Section\SectionCreateForm

    Softspring\CmsBundle\Form\Admin\Section\SectionUpdateFormInterface:
        class: Softspring\CmsBundle\Form\Admin\Section\SectionUpdateForm

    Softspring\CmsBundle\Form\Admin\Section\SectionDeleteFormInterface:
        class: Softspring\CmsBundle\Form\Admin\Section\SectionDeleteForm

    Softspring\CmsBundle\Form\Admin\Section\SectionListFilterFormInterface:
        class: Softspring\CmsBundle\Form\Admin\Section\SectionListFilterForm

    sfs_cms.admin.section.controller:
        class: Softspring\Component\CrudlController\Controller\CrudlController
        public: true
        arguments:
            $manager: '@Softspring\CmsBundle\Manager\SectionManagerInterface'
            $configs:
                entity_attribute: 'section'
                create:
                    is_granted: 'PERMISSION_SFS_CMS_ADMIN_SECTION_CREATE'
                    initialize_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_INITIALIZE
                    create_entity_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_ENTITY
                    form_prepare_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_FORM_PREPARE
                    form_init_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_FORM_INIT
                    form_valid_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_FORM_VALID
                    apply_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_APPLY
                    success_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_SUCCESS
                    failure_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_FAILURE
                    form_invalid_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_FORM_INVALID
                    view_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_VIEW
                    exception_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_CREATE_EXCEPTION
                    success_redirect_to: 'sfs_cms_admin_sections_list'
                    view: '%sfs_cms.admin.sections.create_view%'
                    form: '@Softspring\CmsBundle\Form\Admin\Section\SectionCreateFormInterface'
#                import:
#                    initialize_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_IMPORT_INITIALIZE
#                    create_entity_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_IMPORT_ENTITY
#                    form_prepare_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_IMPORT_FORM_PREPARE
#                    form_init_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_IMPORT_FORM_INIT
#                    form_valid_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_IMPORT_FORM_VALID
#                    apply_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_IMPORT_APPLY
#                    success_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_IMPORT_SUCCESS
#                    failure_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_IMPORT_FAILURE
