services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Softspring\CmsBundle\Request\ValueResolver\SectionValueResolver:
        tags:
            -   controller.argument_value_resolver:
                    name: section_id
                    priority: 150

    Softspring\CmsBundle\Request\ValueResolver\SectionVersionValueResolver:
        tags:
            -   controller.argument_value_resolver:
                    name: section_version_id
                    priority: 150