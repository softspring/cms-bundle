                    view: '%sfs_cms.admin.sections.delete_view%'
                    form: '@Softspring\CmsBundle\Form\Admin\Section\SectionDeleteFormInterface'
                list:
                    is_granted: 'PERMISSION_SFS_CMS_ADMIN_SECTION_LIST'
                    initialize_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_LIST_INITIALIZE
                    filter_form_prepare_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_LIST_FILTER_FORM_PREPARE
                    filter_form_init_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_LIST_FILTER_FORM_INIT
                    filter_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_LIST_FILTER
                    view_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_LIST_VIEW
                    exception_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_LIST_EXCEPTION
                    view: '%sfs_cms.admin.sections.list_view%'
                    view_page: '%sfs_cms.admin.sections.list_page_view%'
                    filter_form: '@Softspring\CmsBundle\Form\Admin\Section\SectionListFilterFormInterface'
                unpublish:
                    is_granted: 'PERMISSION_SFS_CMS_ADMIN_SECTION_UNPUBLISH'
