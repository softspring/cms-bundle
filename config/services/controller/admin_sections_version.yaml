                version_publish:
                    is_granted: 'PERMISSION_SFS_CMS_ADMIN_SECTION_VERSION_PUBLISH'
                    param_converter_key: 'id'
                    initialize_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_PUBLISH_INITIALIZE
                    load_entity_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_PUBLISH_LOAD_ENTITY
                    not_found_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_PUBLISH_NOT_FOUND
                    found_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_PUBLISH_FOUND
                    apply_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_PUBLISH_APPLY
                    success_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_PUBLISH_SUCCESS
                    failure_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_PUBLISH_FAILURE
                    exception_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_PUBLISH_EXCEPTION
#                version_export:
#                    param_converter_key: 'id'
#                    initialize_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_EXPORT_INITIALIZE
#                    load_entity_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_EXPORT_LOAD_ENTITY
#                    not_found_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_VERSIONS_EXPORT_NOT_FOUND
