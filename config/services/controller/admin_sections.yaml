#                    view_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_IMPORT_VIEW
#                    exception_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_IMPORT_EXCEPTION
                read:
                    is_granted: 'PERMISSION_SFS_CMS_ADMIN_SECTION_READ'
                    param_converter_key: 'id'
                    initialize_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_READ_INITIALIZE
                    load_entity_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_READ_LOAD_ENTITY
                    not_found_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_READ_NOT_FOUND
                    found_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_READ_FOUND
                    view_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_READ_VIEW
                    exception_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_READ_EXCEPTION
                    view: '%sfs_cms.admin.sections.read_view%'
                update:
                    is_granted: 'PERMISSION_SFS_CMS_ADMIN_SECTION_UPDATE'
                    param_converter_key: 'id'
                    initialize_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_UPDATE_INITIALIZE
                    load_entity_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_UPDATE_LOAD_ENTITY
                    not_found_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_UPDATE_NOT_FOUND
