                    form_prepare_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_UPDATE_FORM_PREPARE
                    form_init_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_UPDATE_FORM_INIT
