services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Softspring\CmsBundle\Request\ValueResolver\ContentValueResolver:
        tags:
            -   controller.argument_value_resolver:
                    name: content_id
                    priority: 150

    Softspring\CmsBundle\Request\ValueResolver\ContentVersionValueResolver:
        tags:
            -   controller.argument_value_resolver:
                    name: content_version_id
                    priority: 150