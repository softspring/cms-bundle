module:
    meta:
        ai_instructions: Embed a reusable block selected by its configured type. Inspect the block type instructions and reuse its supported fields.
    revision: 1
    group: 'cms-blocks'
    edit_template: '@module/block_instance_by_type/edit.html.twig'
    form_template: '@module/block_instance_by_type/form.html.twig'
    render_template: '@module/block_instance_by_type/render.html.twig'
    module_options:
        label_format: 'modules.block_instance_by_type.%%name%%.label'
        form_fields:
            id:
                type: 'id'

            class:
                type: 'class'

            block:
                type: 'blockType'
