name: CI

on:
    push:
        branches: [ 6.0 ]
    pull_request:
        branches: [ 6.0 ]

permissions:
    contents: read

env:
    XDEBUG_MODE: coverage

jobs:
    backend:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-versions: [ '8.4' ]
                composer-prefer: [ '', '--prefer-lowest' ]

        steps:
            -   uses: actions/checkout@v7

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    #                  extensions: intl #optional
                    ini-values: "post_max_size=256M" #optional

            -   name: Check PHP Version
                run: php -v

            -   name: Validate composer.json
                run: composer validate --strict --no-check-lock

            -   name: Cache Composer packages
                id: composer-cache
                uses: actions/cache@v5
                with:
                    path: vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-php-

            -   name: Install dependencies
                run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.composer-prefer }}

            -   name: Run phpstan
                run: ./vendor/bin/phpstan analyse src tests --level 5

            -   name: Run tests
                run: ./vendor/bin/phpunit

            -   name: Code Style check
                run: ./vendor/bin/php-cs-fixer fix -v --diff --dry-run --sequential

            -   name: Run Rector
                run: ./vendor/bin/rector process src tests --dry-run

            -   name: Lint YAML in .github
                run: ./vendor/bin/yaml-lint .github/ -vvv --parse-tags

            -   name: Lint YAML in config
                run: ./vendor/bin/yaml-lint config/ -vvv --parse-tags

            -   name: Lint YAML in translations
                run: ./vendor/bin/yaml-lint translations/ -vvv --parse-tags

            -   name: Upload coverage to Codecov
                if: matrix.composer-prefer == ''
                uses: codecov/codecov-action@v7
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    files: clover.xml

    frontend:
        needs: backend
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-versions: [ '20' ]
                npm-versions: [ '10' ]
        steps:
            -   uses: actions/checkout@v7

            -   name: Install Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: ${{ matrix.node-versions }}

            -   name: Check Node.js Version
                run: node -v

            -   name: Check npm Version
                run: npm -v

            -   name: Cache npm packages
                id: npm-cache
                uses: actions/cache@v5
                with:
                    path: node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
                    restore-keys: |
                        ${{ runner.os }}-node-

            -   name: Install npm dependencies
                run: npm install --no-package-lock --no-audit --no-fund

            -   name: Run eslint
                run: npm run lint

            -   name: Build assets
                run: npm run build

    build-dist:
        needs: frontend
        runs-on: ubuntu-latest
        permissions:
            contents: write

        env:
            CI_COMMIT_MESSAGE: Continuous Integration Assets Build Artifacts
            CI_COMMIT_AUTHOR: Continuous Integration
            BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ env.BRANCH_NAME }}
                    token: ${{ secrets.CI_PUSH_TOKEN || github.token }}

            -   name: Install Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '20'

            -   name: Cache npm packages
                id: npm-cache
                uses: actions/cache@v5
                with:
                    path: node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
                    restore-keys: |
                        ${{ runner.os }}-node-

            -   name: Install npm dependencies
                run: npm install --no-package-lock --no-audit --no-fund

            -   name: Build dist
                run: npm run build

            -   name: Check dist is clean on pull requests
                if: github.event_name == 'pull_request'
                run: |
                    if [ -n "$(git status --porcelain -- assets/dist)" ]; then
                        git status --short -- assets/dist
                        exit 1
                    fi

            -   name: Commit dist changes
                if: github.event_name == 'push'
                run: |
                    if [ -z "$(git status --porcelain -- assets/dist)" ]; then
                        exit 0
                    fi

                    if [ -z "${{ secrets.CI_PUSH_TOKEN }}" ]; then
                        echo "::error::CI_PUSH_TOKEN is required to push generated dist files to protected branches."
                        exit 1
                    fi

                    git config user.name "${{ env.CI_COMMIT_AUTHOR }}"
                    git config user.email "username@users.noreply.github.com"
                    git add assets/dist
                    git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
                    git push https://x-access-token:${{ secrets.CI_PUSH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ env.BRANCH_NAME }}
