                    is_granted: 'PERMISSION_SFS_CMS_ADMIN_SECTION_CLEANUP_VERSIONS'
                    param_converter_key: 'id'
                    initialize_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_CLEANUP_VERSIONS_INITIALIZE
                    load_entity_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_CLEANUP_VERSIONS_LOAD_ENTITY
                    not_found_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTION_CLEANUP_VERSIONS_NOT_FOUND
