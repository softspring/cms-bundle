services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    _instanceof:
        Softspring\CmsBundle\Admin\Menu\MenuProviderInterface:
            tags: [ 'sfs_cms.admin_menu.menu_provider' ]

    Softspring\CmsBundle\Admin\Menu\MenuManager:
        arguments:
            $menuProviders: !tagged_iterator { tag: sfs_cms.admin_menu.menu_provider, default_priority_method: getPriority }

    Softspring\CmsBundle\Admin\Menu\ContentMenuProvider: ~

    Softspring\CmsBundle\Twig\Extension\Admin\:
        resource: '../../src/Twig/Extension/Admin/*'
        tags: [ 'twig.extension' ]
        bind:
            $contentRecompileEnabled: '%sfs_cms.content.recompile_enabled%'

    Softspring\CmsBundle\Admin\ActionListener\Media\:
        resource: '../../src/Admin/ActionListener/Media/*'
