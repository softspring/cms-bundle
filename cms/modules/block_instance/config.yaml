module:
    meta:
        ai_instructions: Embed an existing reusable CMS block instance. Inspect its type, purpose and fields rather than copying its markup into the page.
    revision: 1
    group: 'cms-blocks'
    edit_template: '@module/block_instance/edit.html.twig'
    form_template: '@module/block_instance/form.html.twig'
    render_template: '@module/block_instance/render.html.twig'
    module_options:
        label_format: 'modules.block_instance.%%name%%.label'
        form_fields:
            id:
                type: 'id'

            class:
                type: 'class'

            block:
                type: 'blockInstance'
