                    failure_event_name: !php/const Softspring\CmsBundle\SfsCmsEvents::ADMIN_SECTIONS_UNPUBLISH_FAILURE
                preview:
                    is_granted: 'PERMISSION_SFS_CMS_ADMIN_SECTION_PREVIEW'
