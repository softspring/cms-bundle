module:
    meta:
        ai_instructions: Render an existing static CMS block. Reuse its configured template instead of duplicating static markup in content modules.
    revision: 1
    group: 'cms-blocks'
    edit_template: '@module/block_static/edit.html.twig'
    form_template: '@module/block_static/form.html.twig'
    render_template: '@module/block_static/render.html.twig'
    module_options:
        label_format: 'modules.block_static.%%name%%.label'
        form_fields:
            id:
                type: 'id'

            class:
                type: 'class'

            block:
                type: 'blockStatic'
