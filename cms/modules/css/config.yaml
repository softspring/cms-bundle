module:
    meta:
        ai_instructions: Use for necessary page-specific CSS in a compatible container. Prefer existing styles and module options; avoid introducing global overrides for a local content change.
    revision: 1
    group: 'helper'
    edit_template: '@module/css/edit.html.twig'
    form_template: '@module/css/form.html.twig'
    render_template: '@module/css/render.html.twig'
    module_options:
        label_format: 'modules.css.%%name%%.label'
        locale_filter: false
        form_fields:
            css:
                type: 'css'
                
